<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="busc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .nf   { fill:#151d30; stroke:#3b82f6; stroke-width:1.6; }
      .newf { fill:#1a1430; stroke:#8b5cf6; stroke-width:1.8; }
      .lbl  { fill:#e8edf5; font-size:15px; font-weight:700; text-anchor:middle; }
      .sub  { fill:#9fb0c8; font-size:11px; text-anchor:middle; }
      .ttl  { fill:#e8edf5; font-size:15px; font-weight:800; }
      .bus  { stroke:url(#busc); stroke-width:4; }
      .ln   { stroke:#30455f; stroke-width:1.6; }
      .ref  { fill:#6b7a94; font-size:11px; text-anchor:middle; }
      .zone { fill:#0e1526; stroke:#223049; stroke-width:1.3; }
    </style>
  </defs>
  <rect width="960" height="440" fill="#0a0e1a"/>

  <text class="ttl" x="40" y="34">6G Core — evolving the service-based architecture (from TS 23.501)</text>

  <!-- Service-based bus -->
  <line class="bus" x1="60" y1="150" x2="900" y2="150"/>
  <text class="ref" x="60" y="140" text-anchor="start">Service-based interfaces</text>

  <!-- Control-plane NFs on the bus -->
  <g>
    <rect class="nf" x="70"  y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="116" y="190">AMF</text><text class="sub" x="116" y="207">mobility</text>
    <line class="ln" x1="116" y1="170" x2="116" y2="150"/>

    <rect class="nf" x="182" y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="228" y="190">SMF</text><text class="sub" x="228" y="207">sessions</text>
    <line class="ln" x1="228" y1="170" x2="228" y2="150"/>

    <rect class="nf" x="294" y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="340" y="190">PCF</text><text class="sub" x="340" y="207">policy</text>
    <line class="ln" x1="340" y1="170" x2="340" y2="150"/>

    <rect class="nf" x="406" y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="452" y="190">NEF</text><text class="sub" x="452" y="207">exposure</text>
    <line class="ln" x1="452" y1="170" x2="452" y2="150"/>

    <rect class="nf" x="518" y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="564" y="190">UDM</text><text class="sub" x="564" y="207">subscriber</text>
    <line class="ln" x1="564" y1="170" x2="564" y2="150"/>

    <rect class="nf" x="630" y="170" width="92" height="48" rx="10"/>
    <text class="lbl" x="676" y="190">UDR</text><text class="sub" x="676" y="207">data store</text>
    <line class="ln" x1="676" y1="170" x2="676" y2="150"/>

    <rect class="nf" x="742" y="170" width="100" height="48" rx="10"/>
    <text class="lbl" x="792" y="190">AUSF</text><text class="sub" x="792" y="207">auth</text>
    <line class="ln" x1="792" y1="170" x2="792" y2="150"/>
  </g>

  <!-- AI-native / new NFs above the bus -->
  <g>
    <rect class="newf" x="150" y="64" width="150" height="48" rx="10"/>
    <text class="lbl" x="225" y="84">NWDAF</text><text class="sub" x="225" y="101">AI/ML analytics + training</text>
    <line class="ln" x1="225" y1="112" x2="225" y2="150"/>

    <rect class="newf" x="330" y="64" width="150" height="48" rx="10"/>
    <text class="lbl" x="405" y="84">SenF*</text><text class="sub" x="405" y="101">sensing function (ISAC)</text>
    <line class="ln" x1="405" y1="112" x2="405" y2="150"/>

    <rect class="newf" x="510" y="64" width="190" height="48" rx="10"/>
    <text class="lbl" x="605" y="84">AI-native NFs*</text><text class="sub" x="605" y="101">embedded inference</text>
    <line class="ln" x1="605" y1="112" x2="605" y2="150"/>
  </g>

  <!-- User plane -->
  <rect class="nf" x="182" y="300" width="110" height="52" rx="10"/>
  <text class="lbl" x="237" y="322">UPF</text><text class="sub" x="237" y="339">user plane</text>
  <line class="ln" x1="255" y1="300" x2="255" y2="218"/>
  <text class="ref" x="276" y="262" text-anchor="start">N4</text>

  <rect class="zone" x="70" y="300" width="90" height="52" rx="12"/>
  <text class="lbl" x="115" y="331">RAN</text>
  <line class="ln" x1="160" y1="326" x2="182" y2="326"/>
  <text class="ref" x="171" y="316">N3</text>

  <rect class="zone" x="330" y="300" width="150" height="52" rx="12"/>
  <text class="lbl" x="405" y="331">Data Network</text>
  <line class="ln" x1="292" y1="326" x2="330" y2="326"/>
  <text class="ref" x="311" y="316">N6</text>

  <!-- compute-network integration note -->
  <rect class="newf" x="540" y="300" width="330" height="52" rx="10"/>
  <text class="lbl" x="705" y="322">Compute–network integration*</text>
  <text class="sub" x="705" y="339">user plane co-scheduled with edge compute</text>

  <text class="ref" x="40" y="400" text-anchor="start">* NWDAF/SenF are evolving; AI-native NFs and compute–network integration are 6G study topics.</text>
  <text class="ref" x="40" y="420" text-anchor="start">Baseline functions and interfaces: TS 23.501 / TS 23.502. 6G core architecture: SA2, expected normative in Release 21.</text>
</svg>
